# 敏感信息（密码 / API Key）已迁移至项目根目录 .env
# MySQL 配置
[mysql]
host = localhost
user = root
database = subjects_kg

# Redis 配置
[redis]
host = localhost
port = 6379
db = 0

# Milvus 配置
[milvus]
host = localhost
port = 19530
database_name = itcast
collection_name = edurag_1115

# LLM 配置
[llm]
model = qwen-plus
dashscope_base_url = https://dashscope.aliyuncs.com/compatible-mode/v1

# 检索参数配置
[retrieval]
parent_chunk_size = 500
child_chunk_size = 100
chunk_overlap = 20
retrieval_k = 10
candidate_m = 8

# 日志配置
[logger]
log_file = logs/app.log

# 应用配置
[app]
valid_sources = ["ai", "java", "test", "ops", "bigdata"]
customer_service_phone = 12345678